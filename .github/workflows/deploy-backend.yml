name: Deploy Backend to Windows Docker Server

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Docker version
        shell: powershell
        run: |
          docker --version
          docker compose version

      - name: Build and start containers
        shell: powershell
        run: |
          docker compose up -d --build --no-deps backend-api backend-worker training-worker

      - name: Show container status
        shell: powershell
        run: |
          docker compose ps
